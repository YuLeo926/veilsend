[package]
name = "sharegate"
version = "0.1.0"
description = "Scan sensitive information before it leaves your computer"
authors = ["ShareGate contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "sharegate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
sharegate-core = { path = "../crates/sharegate-core" }
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_FaceAnalysis",
    "Media_Ocr",
    "Storage_Streams",
] }
windows-future = "=0.3.2"
