[package]
name = "veilsend"
version = "0.2.0-beta.1"
description = "Scan sensitive information before it leaves your computer"
authors = ["VeilSend contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "veilsend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
same-file = "1"
veilsend-core = { path = "../crates/veilsend-core" }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "ApplicationModel_DataTransfer",
    "Data_Pdf",
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_FaceAnalysis",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "System_Profile",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
] }
windows-future = "=0.3.2"
