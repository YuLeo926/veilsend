[package]
name = "sharegate"
version = "0.1.0"
description = "Scan sensitive information before it leaves your computer"
authors = ["ShareGate contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "sharegate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
sharegate-core = { path = "../crates/sharegate-core" }
tauri = { version = "2", features = [] }

