[package]
name = "sharegate-core"
version = "0.1.0"
edition = "2024"
description = "Local scan, sanitize, and verification engine for ShareGate"
license = "MIT"

[dependencies]
hex = "0.4"
once_cell = "1.20"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

