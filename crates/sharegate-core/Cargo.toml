[package]
name = "sharegate-core"
version = "0.1.0"
edition = "2024"
description = "Local scan, sanitize, and verification engine for ShareGate"
license = "MIT"

[dependencies]
bytes = "1"
hex = "0.4"
img-parts = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6"
once_cell = "1.20"
regex = "1.11"
quircs = "0.10.3"
rxing = { version = "=0.9.2", default-features = false, features = ["decoders", "encoding_rs", "multi_barcode_readers", "oned"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
rxing = { version = "=0.9.2", default-features = false, features = ["encoders", "encoding_rs", "oned"] }
serde_json = "1"
