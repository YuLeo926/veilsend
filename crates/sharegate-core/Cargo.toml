[package]
name = "sharegate-core"
version = "0.1.0"
edition = "2024"
description = "Local scan, sanitize, and verification engine for ShareGate"
license = "MIT"

[dependencies]
bytes = "1"
hex = "0.4"
img-parts = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6"
once_cell = "1.20"
regex = "1.11"
quircs = "0.10.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
